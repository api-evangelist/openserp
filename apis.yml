  name: OpenSERP Cloud API
  description: >-
    The managed, hosted version of the OpenSERP search API. Bearer-token authenticated, credit-metered
    pay-as-you-go REST API exposing single-engine web and image search across Google, Bing, Yandex, Baidu,
    DuckDuckGo and Ecosia, multi-engine megasearch with balanced/any/fast execution modes, single and
    batch URL extraction, account balance and live per-operation pricing.
