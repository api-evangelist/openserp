aid: openserp
name: OpenSERP
description: OpenSERP is an open-source, self-hostable SERP API that returns structured search results
  from Google, Bing, Yandex, Baidu, DuckDuckGo and Ecosia through one REST interface, alongside OpenSERP
  Cloud, a managed pay-as-you-go version of the same API adding page extraction, multi-engine megasearch,
  image search and scheduled rank monitoring. The self-hosted server ships an MIT-licensed Go binary and
  CLI with a published OpenAPI 3.0.3 contract, a v2 response envelope carrying query echo, metadata,
  normalized results and pagination, plus cache, proxy-pool and circuit-breaker telemetry endpoints.
  OpenSERP Cloud adds bearer-token authentication, credit-metered billing, engine health routing, batch
  URL extraction and Search Monitor webhooks, and the project publishes first-party JavaScript and Python
  SDKs, an MCP server and an n8n community node.
