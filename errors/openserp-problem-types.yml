envelope:
  shape: '{"error": "<code>", "code": <http status>, "message": "<human text>", "reason":
    "<optional detail tag>"}'
  media_type: application/json
  rfc9457: false
  note: OpenSERP does not use application/problem+json. `error` is the stable machine-readable
    class, `code` mirrors the HTTP status, `message` is human text, and `reason` is an optional
    upper-case validation detail tag. Search-pipeline failures additionally carry a sanitized
    `meta` object (engine, engine_errors[]) that never includes credentials.
retry_policy:
  retryable: [408, 429, 500, 502, 503]
  not_retryable: [400, 401, 402, 404, 422]
  strategy: exponential backoff with jitter, capped attempts; honour Retry-After on 429.
  source: https://openserp.org/docs/cloud-errors/
