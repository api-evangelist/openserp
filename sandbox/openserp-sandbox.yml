summary: OpenSERP publishes no test-mode key class and no mock data. Its sandbox story is instead
  the open-source server itself — the docs explicitly tell developers to point the same SDK at a
  local self-hosted instance with no API key — plus a small set of zero-credit Cloud endpoints and a
  one-time free credit grant.
test_vs_live:
  separate_test_keys: false
  key_prefixes:
    live: osk_live_
    test: null
  note: Only one live key class (`osk_live_`) is documented. There is no test-mode key, no
    test-mode flag, and no simulated result set.
local_sandbox:
  supported: true
  base_url: http://localhost:7000
  api_key_required: false
  documented_at: https://openserp.org/docs/cloud-quickstart/
  quote: 'Running the open-source server locally? Use the same SDK code with baseUrl:
    "http://localhost:7000" and no API key.'
  start_command: docker run --rm -p 127.0.0.1:7000:7000 karust/openserp:latest
  note: The self-hosted server returns real live SERP data, not fixtures — it is a free execution
    environment, not a deterministic test double.
free_credits:
  amount: 60
  unit: credits
  card_required: false
  recurring: false
  description: New accounts receive a one-time grant of 60 free credits, roughly 60 first-page
    searches.
  source: https://openserp.org/docs/cloud-pricing/
zero_cost_operations:
- operation: GET /v1/me
  credits: 0
  purpose: Validate a key and read the account balance. Documented as the deployment smoke test.
- operation: GET /v1/pricing
  credits: 0
  purpose: Live per-operation credit prices. Answers anonymously with HTTP 200.
- operation: GET /v1/engines/status
  credits: 0
  purpose: Engine health and latency.
